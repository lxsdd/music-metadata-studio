name: Core CI

on:
  push:
    # Run safe read-only tests even while the long-running draft PR is conflicted.
    branches: [ main, feature/precision-cue-generator-20261017 ]
    paths:
      - 'include/**'
      - 'src/core/**'
      - 'src/interop/**'
      - 'tests/**'
      - 'src/foobar/native_preview_controls.h'
      - 'src/foobar/component.rc'
      - 'src/foobar/batch_preview_dialog.cpp'
      - 'rules/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'include/**'
      - 'src/core/**'
      - 'src/interop/**'
      - 'tests/**'
      - 'src/foobar/native_preview_controls.h'
      - 'src/foobar/component.rc'
      - 'src/foobar/batch_preview_dialog.cpp'
      - 'rules/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: dj-metadata-normalizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate persisted rules
        shell: bash
        run: python tests/validate_rules.py

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Windows integration artifact
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force integration-artifact/rules | Out-Null
          Copy-Item build/Release/djmeta_native.dll integration-artifact/djmeta_native.dll
          Copy-Item rules/default-rules.json integration-artifact/rules/default-rules.json
          @(
            "commit=$env:GITHUB_SHA",
            'abi_version=1',
            'ruleset=rules/default-rules.json'
          ) | Set-Content -Encoding UTF8 integration-artifact/MANIFEST.txt

      - name: Upload Windows integration artifact
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: djmeta-native-${{ github.sha }}
          path: integration-artifact/**
          if-no-files-found: error
          retention-days: 90
