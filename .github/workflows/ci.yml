name: Core CI

on:
  push:
    branches: [ main ]
    paths:
      - 'include/**'
      - 'src/core/**'
      - 'src/interop/**'
      - 'tests/core_tests.cpp'
      - 'tests/batch_plan_tests.cpp'
      - 'tests/physical_selection_tests.cpp'
      - 'tests/external_cue_tests.cpp'
      - 'tests/cue_association_tests.cpp'
      - 'tests/staging_tests.cpp'
      - 'tests/route_profiles_tests.cpp'
      - 'tests/routing_overrides_tests.cpp'
      - 'tests/batch_preview_tests.cpp'
      - 'tests/table_layout_tests.cpp'
      - 'tests/metadata_diff_tests.cpp'
      - 'tests/track_review_tests.cpp'
      - 'tests/review_decisions_tests.cpp'
      - 'tests/native_preview_controls_tests.cpp'
      - 'src/foobar/native_preview_controls.h'
      - 'src/foobar/component.rc'
      - 'src/foobar/batch_preview_dialog.cpp'
      - 'tests/c_api_tests.cpp'
      - 'tests/validate_rules.py'
      - 'tests/static_foobar_audit.py'
      - 'rules/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'include/**'
      - 'src/core/**'
      - 'src/interop/**'
      - 'tests/core_tests.cpp'
      - 'tests/batch_plan_tests.cpp'
      - 'tests/physical_selection_tests.cpp'
      - 'tests/external_cue_tests.cpp'
      - 'tests/cue_association_tests.cpp'
      - 'tests/staging_tests.cpp'
      - 'tests/route_profiles_tests.cpp'
      - 'tests/routing_overrides_tests.cpp'
      - 'tests/batch_preview_tests.cpp'
      - 'tests/table_layout_tests.cpp'
      - 'tests/metadata_diff_tests.cpp'
      - 'tests/track_review_tests.cpp'
      - 'tests/review_decisions_tests.cpp'
      - 'tests/native_preview_controls_tests.cpp'
      - 'src/foobar/native_preview_controls.h'
      - 'src/foobar/component.rc'
      - 'src/foobar/batch_preview_dialog.cpp'
      - 'tests/c_api_tests.cpp'
      - 'tests/validate_rules.py'
      - 'tests/static_foobar_audit.py'
      - 'rules/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: music-metadata-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate persisted rules
        shell: bash
        run: python tests/validate_rules.py

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Windows integration artifact
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force integration-artifact/rules | Out-Null
          Copy-Item build/Release/djmeta_native.dll integration-artifact/djmeta_native.dll
          Copy-Item rules/default-rules.json integration-artifact/rules/default-rules.json
          @(
            "commit=$env:GITHUB_SHA",
            'abi_version=1',
            'ruleset=rules/default-rules.json'
          ) | Set-Content -Encoding UTF8 integration-artifact/MANIFEST.txt

      - name: Upload Windows integration artifact
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: djmeta-native-${{ github.sha }}
          path: integration-artifact/**
          if-no-files-found: error
          retention-days: 90
