name: foobar Preview Component

on:
  push:
    branches: [ main ]
    paths:
      - 'include/**'
      - 'src/core/**'
      - 'src/foobar/**'
      - 'rules/**'
      - 'scripts/**'
      - 'tests/static_foobar_audit.py'
      - 'foo_music_metadata_studio.vcxproj'
      - 'VERSION'
      - '.github/workflows/foobar.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'include/**'
      - 'src/core/**'
      - 'src/foobar/**'
      - 'rules/**'
      - 'scripts/**'
      - 'tests/static_foobar_audit.py'
      - 'foo_music_metadata_studio.vcxproj'
      - 'VERSION'
      - '.github/workflows/foobar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: djmeta-foobar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify analysis-only foobar boundary
        run: python tests/static_foobar_audit.py

  host-gate-script:
    needs: static-audit
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test isolated host acceptance preparation and integrity verification
        shell: pwsh
        run: ./tests/host_acceptance_noop_tests.ps1

  windows-build:
    needs: static-audit
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v2
      - name: Build foobar preview component
        shell: pwsh
        run: ./scripts/build-foobar.ps1 -Platform '${{ matrix.platform }}' -Configuration Release -PlatformToolset v143
      - name: Upload DLL
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: foo-music-metadata-studio-${{ matrix.platform }}
          path: out/foobar/${{ matrix.platform }}/Release/foo_music_metadata_studio.dll
          if-no-files-found: error
          retention-days: 7

  # Internal PRs may publish short-lived QA artifacts, never GitHub Releases.
  # Fork PRs remain build-only so untrusted code cannot publish previews.
  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [static-audit, host-gate-script, windows-build]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: foo-music-metadata-studio-Win32
          path: candidate-input/Win32
      - uses: actions/download-artifact@v8
        with:
          name: foo-music-metadata-studio-x64
          path: candidate-input/x64
      - name: Package verified combined component
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath VERSION).Trim()
          ./scripts/package-foobar.ps1 `
            -Win32Dll 'candidate-input/Win32/foo_music_metadata_studio.dll' `
            -X64Dll 'candidate-input/x64/foo_music_metadata_studio.dll' `
            -OutputDirectory 'candidate-output' `
            -Version $version `
            -Commit '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Upload combined component
        uses: actions/upload-artifact@v7
        with:
          name: foo-music-metadata-studio-component
          path: |
            candidate-output/*.fb2k-component
            candidate-output/BUILD-MANIFEST.txt
            candidate-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
