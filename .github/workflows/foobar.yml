name: foobar Preview Component

on:
  push:
    # Run safe read-only tests even while the long-running draft PR is conflicted.
    branches: [ main, feature/precision-cue-generator-20261017 ]
    paths:
      - 'include/**'
      - 'src/core/**'
      - 'src/foobar/**'
      - 'rules/**'
      - 'scripts/**'
      - 'tests/**'
      - 'foo_dj_metadata_normalizer.vcxproj'
      - 'VERSION'
      - '.github/workflows/foobar.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'include/**'
      - 'src/core/**'
      - 'src/foobar/**'
      - 'rules/**'
      - 'scripts/**'
      - 'tests/**'
      - 'foo_dj_metadata_normalizer.vcxproj'
      - 'VERSION'
      - '.github/workflows/foobar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: djmeta-foobar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify analysis-only foobar boundary
        run: python tests/static_foobar_audit.py
      - name: Enforce source-pinned public artifact hold
        run: python3 scripts/verify-public-artifact-hold.py

  host-gate-script:
    needs: static-audit
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test isolated host acceptance preparation and integrity verification
        shell: pwsh
        run: ./tests/host_acceptance_noop_tests.ps1

  windows-build:
    needs: static-audit
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@v7
      - name: Checkout exact public owner foobar SDK 2026-10-01 tree
        uses: actions/checkout@v7
        with:
          repository: lxsdd/foobar2000_component_template
          ref: 31a35947a7527826c2199491692802e3ce3d8bd7
          path: external/sdk-template
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Build foobar preview component
        shell: pwsh
        run: ./scripts/build-foobar.ps1 -Platform '${{ matrix.platform }}' -Configuration Release -PlatformToolset v143
      - name: HARD GATE - real foobar2000 ${{ matrix.platform }} CUE component load
        uses: lxsdd/dev-infrastructure-public/.github/actions/foobar-host-smoke@2eaf8a84adf3d5614173947ea60d2dafa89ed1ee
        with:
          architecture: ${{ matrix.platform }}
          component-dll: out/foobar/${{ matrix.platform }}/Release/foo_dj_metadata_normalizer.dll
          context-command: 'Precision CUE (Preview)'
          context-fixture-format: 'mp3'
          expected-window-title: 'Precision CUE - Preview / External CUE Create'
          required-control-ids: '331,332,333,335,336,337,338,339,340,341,342,343'
      - name: Upload DLL
        if: false # Hold public DLL uploads until explicit owner distribution approval
        uses: actions/upload-artifact@v7
        with:
          name: foo-dj-metadata-normalizer-${{ matrix.platform }}
          path: out/foobar/${{ matrix.platform }}/Release/foo_dj_metadata_normalizer.dll
          if-no-files-found: error
          retention-days: 7

  # Internal PRs may publish short-lived QA artifacts, never GitHub Releases.
  # Fork PRs remain build-only so untrusted code cannot publish previews.
  package:
    if: false # Hold public component package uploads until explicit owner approval
    needs: [static-audit, host-gate-script, windows-build]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: foo-dj-metadata-normalizer-Win32
          path: candidate-input/Win32
      - uses: actions/download-artifact@v8
        with:
          name: foo-dj-metadata-normalizer-x64
          path: candidate-input/x64
      - name: Package verified combined component
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath VERSION).Trim()
          ./scripts/package-foobar.ps1 `
            -Win32Dll 'candidate-input/Win32/foo_dj_metadata_normalizer.dll' `
            -X64Dll 'candidate-input/x64/foo_dj_metadata_normalizer.dll' `
            -OutputDirectory 'candidate-output' `
            -Version $version `
            -Commit '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Upload combined component
        if: false # Independently disabled even if the package job is edited
        uses: actions/upload-artifact@v7
        with:
          name: foo-dj-metadata-normalizer-component
          path: |
            candidate-output/*.fb2k-component
            candidate-output/BUILD-MANIFEST.txt
            candidate-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
